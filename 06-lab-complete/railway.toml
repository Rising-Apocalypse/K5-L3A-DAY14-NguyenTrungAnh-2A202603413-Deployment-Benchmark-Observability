# Deploy từ thư mục này: railway up
# AGENT_API_KEY và REDIS_URL đặt bằng biến môi trường trên Railway, không ghi ở đây.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

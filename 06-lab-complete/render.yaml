# Render Blueprint. File nằm trong thư mục con nên khi tạo Blueprint phải điền
# Blueprint Path = 06-lab-complete/render.yaml
services:
  - type: web
    name: day14-agent
    runtime: docker
    plan: free
    rootDir: 06-lab-complete
    dockerfilePath: ./Dockerfile      # tính từ rootDir
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"
      - key: AGENT_API_KEY
        generateValue: true           # Render tự tạo, không ghi trong repo
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: day14-redis
          property: connectionString

  - type: keyvalue
    name: day14-redis
    plan: free
    maxmemoryPolicy: noeviction       # không để bộ đếm rate limit / chi phí bị xoá
    ipAllowList: []                   # chỉ truy cập trong mạng nội bộ Render
